# FedGuard settings FROZEN on the VALIDATION split (Findings F50, 18 Nov 2026) - used by every FedGuard test-set
# experiment (e5_fedguard, mixed_eps_fedguard, e4_conflict_fedguard, e6_ablation_*, e7_stress_*).
# Rule fixed before the results: highest mean validation macro-F1 over no attack + 30% sign flip (seed 42, eps 3,
# alpha 0.5) - the same protocol as AutoGM's lambda (F39). Do not change after looking at test results.
fl:
  aggregator: {name: fedguard, mode: quadrature, k_mad: 2.0, lam_scale: 4.0, outer: 20, noise_tol_z: 3.0, s_floor: noise}
