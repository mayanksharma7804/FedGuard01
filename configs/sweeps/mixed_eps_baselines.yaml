# Mixed privacy (Findings F36): epsilon {1, 3, 8} cycled over the 10 clients (clients 0, 3, 6, 9 have eps 1).
# This is where FedGuard's idea (forgive each client exactly its OWN declared noise) is really tested.
# Baselines here; FedGuard (frozen settings from p7_fedguard_tune) is added in mixed_eps_fedguard.yaml.
# K = 10, alpha 0.5, 40-round budget, 3 seeds, no attack / 30% sign flip.
base: configs/k10_base.yaml
set:
  dp: {epsilon: [1.0, 3.0, 8.0], clip: 2.0}
grid:
  seed: [42, 43, 44]
  fl.aggregator: [{name: autogm, lam_scale: 4.0, outer: 20}, {name: fedavg}]
  attack: [{type: none, fraction: 0.0}, {type: sign_flip, fraction: 0.3}]
