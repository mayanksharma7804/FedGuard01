[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedguard-flower"
version = "1.0.0"
description = "FedGuard on Flower: engine-parity check (Phase 4) and live demo (Phase 8)"
license = "Apache-2.0"
dependencies = ["flwr==1.39.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "fedguard-team"

[tool.flwr.app.components]
serverapp = "fedguard_flower.server_app:app"
clientapp = "fedguard_flower.client_app:app"

[tool.flwr.app.config]
config = "configs/b1_fedavg.yaml"     # relative to the repo root
num-rounds = 5
seed = 42
device = "cpu"
out-dir = "results/flower_parity"
