[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flower-check"
version = "1.0.0"
description = "Phase 1 check: Flower deployment mode on native Windows (no Ray), tiny model on synthetic data"
license = "Apache-2.0"
dependencies = ["flwr==1.39.0", "torch", "numpy"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "fedguard-team"

[tool.flwr.app.components]
serverapp = "flower_check.server_app:app"
clientapp = "flower_check.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
local-epochs = 1
lr = 0.1
